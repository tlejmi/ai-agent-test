name: Quick Unit Tests

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app/src/**/*.kt'
      - 'app/build.gradle.kts'
      - '.github/workflows/quick-tests.yml'
  workflow_dispatch:

jobs:
  quick-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Cache Dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.android/build-cache
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Make gradlew executable
      run: chmod +x gradlew
    
    - name: Run Tests
      id: test
      run: |
        ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee test.log
      continue-on-error: true
    
    - name: Comment errors on PR
      if: failure() && steps.test.outcome == 'failure' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let testLog = '';
          try {
            testLog = fs.readFileSync('test.log', 'utf8');
          } catch (e) {
            testLog = 'Test log not available';
          }
          
          const errorLines = testLog.split('\n').filter(line => 
            line.includes('FAILED') || 
            line.includes('ERROR') ||
            line.includes('Exception:')
          ).slice(0, 25);
          
          const errorMessage = errorLines.length > 0 ? errorLines.join('\n') : testLog.slice(-1500);
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## ❌ Quick Tests Failed\n\n<details><summary>Error Details</summary>\n\n\`\`\`\n${errorMessage}\n\`\`\`\n\n</details>\n\nView full details in the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`
          });
    
    - name: Fail workflow if tests failed
      if: steps.test.outcome == 'failure'
      run: exit 1
    
    - name: Comment Test Results on PR
      if: github.event_name == 'pull_request' && always()
      uses: mikepenz/action-junit-report@v4
      with:
        report_paths: 'app/build/test-results/testDebugUnitTest/TEST-*.xml'
        check_name: Quick Test Results
        detailed_summary: true
        include_passed: true
